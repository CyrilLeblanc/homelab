services:

  app:
    container_name: open-webui_app
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    volumes:
      - app-data:/app/backend/data
    networks:
      - default
      - web
    # ports:
    #   - 8000:8000
    environment:
      # Set the API base URL and key for the OpenAI-compatible API (Litellm)
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      # Set the STT engine to use Whisper via the OpenAI-compatible API
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=http://litellm:4000/v1
      - AUDIO_STT_OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - AUDIO_STT_MODEL=whisper-1
      # Set the API base URL and key for the Open Terminal API
      - OPEN_TERMINAL_URL=http://open-terminal:8000
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY:-}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      # Disable Ollama API since we're using Litellm as the OpenAI-compatible API
      - ENABLE_OLLAMA_API=false
    depends_on:
      - litellm
      - open-terminal
      - crawl4ai-proxy
      - pipeline

  litellm:
    container_name: open-webui_litellm
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - default
      - web
    # ports:
    #   - 4000:4000
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
      - UI_USERNAME=${LITELLM_UI_USERNAME}
      - UI_PASSWORD=${LITELLM_UI_PASSWORD}
      - STORE_MODEL_IN_DB=False
      - ZAI_API_KEY=${ZAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OLLAMA_CLOUD_API_KEY=${OLLAMA_CLOUD_API_KEY}
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
    depends_on:
      - litellm-db
      - ollama
      - whisper
      - speaches

  litellm-db:
    container_name: open-webui_litellm-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD}
      - POSTGRES_DB=litellm
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    container_name: open-webui_ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    container_name: open-webui_whisper
    restart: unless-stopped
    # ports:
    #   - "8000:8000"
    volumes:
      - whisper_data:/root/.cache/huggingface
    environment:
      - WHISPER__MODEL=Systran/faster-whisper-medium
      - WHISPER__INFERENCE_DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cuda-12.4.1
    container_name: open-webui_speaches
    restart: unless-stopped
    # ports:
    #   - "8080:8000"
    volumes:
      - speaches_cache:/home/ubuntu/.cache/huggingface
    environment:
      - TTS_MODEL=rhasspy/piper-voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-terminal:
    container_name: open-webui_open-terminal
    image: ghcr.io/open-webui/open-terminal:latest
    restart: unless-stopped
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY:-}
      - OPEN_TERMINAL_PACKAGES=${OPEN_TERMINAL_PACKAGES:-}
      - OPEN_TERMINAL_PIP_PACKAGES=${OPEN_TERMINAL_PIP_PACKAGES:-}
      - OPEN_TERMINAL_NPM_PACKAGES=${OPEN_TERMINAL_NPM_PACKAGES:-}
      - BASH_ENV=/home/user/.bashrc
    # ports:
    #   - 8000:8000
    volumes:
      - open-terminal-data:/home/user

  crawl4ai-proxy:
    container_name: open-webui_crawl4ai-proxy
    image: ghcr.io/lennyerik/crawl4ai-proxy:latest
    restart: unless-stopped
    environment:
      - LISTEN_PORT=8000
      - CRAWL4AI_ENDPOINT=http://crawl4ai:11235/crawl
    depends_on:
      - crawl4ai

  crawl4ai:
    container_name: open-webui_crawl4ai
    image: unclecode/crawl4ai:0.6.0-r2
    restart: unless-stopped
    shm_size: 1g

  pipeline:
    container_name: open-webui_pipeline
    image: ghcr.io/open-webui/pipelines:main
    restart: unless-stopped
    # ports:
    #   - 9099:9099
    environment:
      - OPENWEBUI_URL=http://app:8080
    volumes:
      - pipeline-data:/app/pipelines

volumes:
  app-data:
  litellm-db-data:
  ollama-data:
  whisper_data:
  speaches_cache:
  open-terminal-data:
  pipeline-data:

networks:
  web:
    external: true
