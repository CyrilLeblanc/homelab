services:

  frontend:
    container_name: penpot_frontend
    image: penpotapp/frontend:latest
    restart: unless-stopped
    volumes:
      - assets:/opt/data/assets
    environment:
      - PENPOT_FLAGS=${PENPOT_FLAGS}
      - PENPOT_HTTP_SERVER_MAX_BODY_SIZE=31457280
      - PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE=367001600
    depends_on:
      - backend
      - exporter
    networks:
      - web
      - default
    # ports:
    #   - 8080:8080

  backend:
    container_name: penpot_backend
    image: penpotapp/backend:latest
    restart: unless-stopped
    hostname: penpot-backend
    volumes:
      - assets:/opt/data/assets
    environment:
      - PENPOT_FLAGS=${PENPOT_FLAGS}
      - PENPOT_PUBLIC_URI=${PENPOT_PUBLIC_URI}
      - PENPOT_SECRET_KEY=${PENPOT_SECRET_KEY}
      - PENPOT_HTTP_SERVER_MAX_BODY_SIZE=31457280
      - PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE=367001600
      - PENPOT_DATABASE_URI=postgresql://database/penpot
      - PENPOT_DATABASE_USERNAME=${DB_USER}
      - PENPOT_DATABASE_PASSWORD=${DB_PASSWORD}
      - PENPOT_REDIS_URI=redis://valkey/0
      - PENPOT_ASSETS_STORAGE_BACKEND=assets-fs
      - PENPOT_STORAGE_ASSETS_FS_DIRECTORY=/opt/data/assets
      - PENPOT_TELEMETRY_ENABLED=${PENPOT_TELEMETRY_ENABLED:-false}
      - PENPOT_SMTP_DEFAULT_FROM=${SMTP_FROM}
      - PENPOT_SMTP_DEFAULT_REPLY_TO=${SMTP_REPLY_TO}
      - PENPOT_SMTP_HOST=${SMTP_HOST}
      - PENPOT_SMTP_PORT=${SMTP_PORT}
      - PENPOT_SMTP_USERNAME=${SMTP_USERNAME}
      - PENPOT_SMTP_PASSWORD=${SMTP_PASSWORD}
      - PENPOT_SMTP_TLS=${SMTP_TLS:-false}
      - PENPOT_SMTP_SSL=${SMTP_SSL:-false}
    depends_on:
      database:
        condition: service_healthy
      valkey:
        condition: service_healthy

  exporter:
    container_name: penpot_exporter
    image: penpotapp/exporter:latest
    restart: unless-stopped
    hostname: penpot-exporter
    environment:
      - PENPOT_PUBLIC_URI=http://frontend:8080
      - PENPOT_REDIS_URI=redis://valkey/0
      - PENPOT_SECRET_KEY=${PENPOT_SECRET_KEY}
    depends_on:
      valkey:
        condition: service_healthy

  database:
    container_name: penpot_postgres
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_DB=penpot
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 10s
      retries: 5

  valkey:
    container_name: penpot_valkey
    image: valkey/valkey:8.1
    restart: unless-stopped
    environment:
      - VALKEY_EXTRA_FLAGS=--maxmemory 128mb --maxmemory-policy volatile-lfu
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailcatcher:
    container_name: penpot_mailcatcher
    image: sj26/mailcatcher:latest
    restart: unless-stopped
    ports:
      - 1080:1080

volumes:
  postgres-data:
  assets:

networks:
  web:
    external: true