- Media:
    - Jellyfin:
        href: 
        siteMonitor: https://jellyfin.{{HOMEPAGE_VAR_DOMAIN}}/
        icon: jellyfin
        description: Open source media server
        container: arr_jellyfin
        widget:
            type: jellyfin
            url: https://jellyfin.{{HOMEPAGE_VAR_DOMAIN}}/
            key: {{HOMEPAGE_VAR_JELLYFIN_APP_PASSWORD}}
            enableBlocks: true
            enableNowPlaying: true
            enableUser: true
            showEpisodeNumber: true
            expandOneStreamToTwoRows: true
    - Jellyseerr:
        href: https://jellyseerr.{{HOMEPAGE_VAR_DOMAIN}}/
        siteMonitor: https://jellyseerr.{{HOMEPAGE_VAR_DOMAIN}}/
        icon: jellyseerr
        description: Media request and management tool for Jellyfin
