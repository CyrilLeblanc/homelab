        widget:
            type: jellyseerr
            url: https://jellyseerr.{{HOMEPAGE_VAR_DOMAIN}}/
            key: {{HOMEPAGE_VAR_JELLYSEERR_APP_PASSWORD}}
    - Lidarr:
        href: https://lidarr.{{HOMEPAGE_VAR_DOMAIN}}/
        siteMonitor: 
        icon: lidarr
        description: Music collection manager for Usenet and BitTorrent
        container: arr_lidarr
        widget:
            type: lidarr
            url: https://lidarr.{{HOMEPAGE_VAR_DOMAIN}}/
            key: {{HOMEPAGE_VAR_LIDARR_APP_PASSWORD}}
