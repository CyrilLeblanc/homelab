services:

  app:
    image: binwiederhier/ntfy:latest
    container_name: ntfy_app
    restart: unless-stopped
    command: serve
    environment:
      - TZ=${TZ}
    volumes:
      - app-cache:/var/cache/ntfy
      - app-config:/etc/ntfy
    networks:
      - web
    # ports:
    #   - 80:80
    healthcheck:
        test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 40s
    
volumes:
  app-cache:
  app-config:

networks:
  web:
    external: true