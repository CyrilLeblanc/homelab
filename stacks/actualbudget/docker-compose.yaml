services:

  app:
    image: actualbudget/actual-server:latest
    container_name: actualbudget_app
    restart: unless-stopped
    networks:
      - web
    # ports:
    #   - 5006:5006
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD-SHELL", "node src/scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  app-data:

networks:
  web:
    external: true