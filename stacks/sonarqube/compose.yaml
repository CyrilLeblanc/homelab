services:
  
  app:
    image: sonarqube:26.11.0.134175-community
    container_name: sonarqube_app
    restart: unless-stopped
    ports:
      - 6871:9000
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    environment:
      SONARQUBE_JDBC_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME}
      SONARQUBE_JDBC_USERNAME: ${DATABASE_USER}
      SONARQUBE_JDBC_PASSWORD: ${DATABASE_PASSWORD}
    depends_on:
      - postgres

  postgres:
    image: postgres:18
    container_name: sonarqube_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  sonarqube-data:
  sonarqube-extensions:
  postgres-data: