services:

  app:
    image: ghcr.io/wg-easy/wg-easy:15
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
    volumes:
      - app-data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - 51820:51820/udp # connection port
      # - 51821:51821/tcp # web interface
    networks:
      - web
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1

volumes:
  app-data:

networks:
  web:
    external: true