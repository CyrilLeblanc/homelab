services:

  app:
    container_name: stirling-pdf_app
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    restart: unless-stopped
    networks:
      - web
    # ports:
    #   - 8080:8080
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - LANGS=${LANGS}
      - DISABLE_ADDITIONAL_FEATURES=true
      - SECURITY_ENABLELOGIN=false
    volumes:
      - app-training_data:/usr/share/tessdata:rw
      - app-config:/configs:rw
      - app-custom_files:/customFiles:rw
      - app-logs:/logs:rw
      - app-pipeline:/pipeline:rw

volumes:
  app-training_data:
  app-config:
  app-custom_files:
  app-logs:
  app-pipeline:

networks:
  web:
    external: true