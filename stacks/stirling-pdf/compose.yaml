services:

  app:
    image: stirlingtools/stirling-pdf:latest
    restart: unless-stopped
    networks:
      - web
    # ports:
    #   - 8080:8080
    environment:
      - SECURITY_ENABLELOGIN=false
      - SYSTEM_GOOGLEVISIBILITY=false
      - LANGS=${LANGS}
      - DISABLE_ADDITIONAL_FEATURES=true
    volumes:
      - app-training_data:/usr/share/tessdata:rw
      - app-config:/configs:rw
      - app-logs:/logs:rw
      - app-pipeline:/pipeline:rw

volumes:
  app-training_data:
  app-config:
  app-custom_files:
  app-logs:
  app-pipeline:

networks:
  web:
    external: true