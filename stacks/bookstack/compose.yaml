services:

  app:
    image: lscr.io/linuxserver/bookstack:latest
    restart: unless-stopped
    networks:
      - web
      - default
    # ports:
    #   - 80:80
    volumes:
      - app-data:/config:rw
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - APP_URL=${BOOKSTACK_URL}
      - APP_KEY=${APP_KEY}
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USERNAME=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_NAME}
      - QUEUE_CONNECTION=database

  mariadb:
    image: mariadb:latest
    restart: unless-stopped
    volumes:
      - mariadb-data:/var/lib/mysql:rw
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}

volumes:
  app-data:
  mariadb-data:

networks:
  web:
    external: true