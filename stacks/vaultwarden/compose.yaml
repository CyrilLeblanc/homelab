services:

  app:
    image: ghcr.io/dani-garcia/vaultwarden:1.37.5-alpine
    restart: unless-stopped
    volumes:
      - app-data:/data:rw
    networks:
      - web
    ports:
      - 81:80
    environment:
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED}

volumes:
  app-data:

networks:
  web:
    external: true