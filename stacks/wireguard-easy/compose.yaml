services:

  app:
    image: ghcr.io/wg-easy/wg-easy:latest
    restart: unless-stopped
    environment:
      - WG_HOST=${WG_HOST}
      - PASSWORD_HASH=${PASSWORD_HASH}
    volumes:
      - app-data:/etc/wireguard
    ports:
      - 51820:51820/udp # connection port
      # - 51821:51821/tcp # web interface
    networks:
      - web
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1

volumes:
  app-data:

networks:
  web:
    external: true